<!doctype html>
<html data-theme="__THEME__">
<head>
<meta charset="utf-8">
<style>
  :root{ --ink:#1f2420; --ink-soft:#5b6259; --accent:#2c5f4a; --accent2:#b5562f; }
  :root[data-theme="dark"]{ --ink:#eef1ec; --ink-soft:#a7b0a6; --accent:#7fd2ab; --accent2:#e2986c; }
  :root[data-theme="light"]{ --ink:#1f2420; --ink-soft:#5b6259; --accent:#2c5f4a; --accent2:#b5562f; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    width:260px; height:260px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg{ overflow:visible; shape-rendering:geometricPrecision; }
  .line-main{ fill:none; stroke:var(--ink); stroke-width:2.5; }
  .line-accent{ fill:none; stroke:var(--accent); stroke-width:2.5; }
  .line-aux{ stroke:var(--accent2); stroke-width:2; stroke-dasharray:5 4; }
  .pt{ fill:var(--ink); }
  .pt-accent{ fill:var(--accent); }
  .label{ font-size:15px; fill:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .label-soft{ fill:var(--ink-soft); font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
</style>
</head>
<body>
  <!-- 把下面这个 svg 换成实际要画的图形，body 尺寸按图形改 -->
  <svg width="220" height="220" viewBox="0 0 220 220">
    <circle class="line-accent" cx="110" cy="110" r="80" />
    <line class="line-aux" x1="110" y1="110" x2="167.3" y2="52.7" />
    <circle class="pt" cx="110" cy="110" r="4" />
    <text class="label" x="118" y="106">O</text>
    <circle class="pt-accent" cx="167.3" cy="52.7" r="4" />
    <text class="label" x="176" y="49">A</text>
  </svg>
</body>
</html>
