<!doctype html>
<html data-theme="__THEME__">
<head>
<meta charset="utf-8">
<style>
  /*
    这个模板是透明背景，会被放到未知背景上看（白色查看器、深色聊天气泡都可能）。
    所以文字和关键点故意不跟随 __THEME__ 变色，而是固定"深色描边 + 浅色轮廓"的
    双色描边方案（text-halo 技巧），保证在浅色和深色背景上都能看清，不需要猜背景色。
    线条本身用饱和的强调色（绿/橙），在浅色和深色背景上对比度都够，所以不用改。
  */
  :root{ --accent:#2c8a63; --accent2:#c05a2c; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    width:260px; height:260px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg{ overflow:visible; shape-rendering:geometricPrecision; }
  .line-main{ fill:none; stroke:#333; stroke-width:2.5; paint-order:stroke; stroke-linecap:round; }
  .line-accent{ fill:none; stroke:var(--accent); stroke-width:3; }
  .line-aux{ stroke:var(--accent2); stroke-width:2.5; stroke-dasharray:5 4; }
  .pt{ fill:#1f2420; stroke:#ffffff; stroke-width:2.5; }
  .pt-accent{ fill:var(--accent); stroke:#ffffff; stroke-width:2; }
  .label{
    font-size:16px; font-weight:600; fill:#1f2420;
    stroke:#ffffff; stroke-width:3.5px; paint-order:stroke fill;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .label-soft{
    font-size:14px; fill:#3d453f;
    stroke:#ffffff; stroke-width:3px; paint-order:stroke fill;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
</style>
</head>
<body>
  <!-- 把下面这个 svg 换成实际要画的图形，body 尺寸按图形改 -->
  <svg width="220" height="220" viewBox="0 0 220 220">
    <circle class="line-accent" cx="110" cy="110" r="80" />
    <line class="line-aux" x1="110" y1="110" x2="167.3" y2="52.7" />
    <circle class="pt" cx="110" cy="110" r="4" />
    <text class="label" x="118" y="106">O</text>
    <circle class="pt-accent" cx="167.3" cy="52.7" r="4" />
    <text class="label" x="176" y="49">A</text>
  </svg>
</body>
</html>
