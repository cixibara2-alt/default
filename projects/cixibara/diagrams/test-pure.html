<!doctype html>
<html data-theme="__THEME__">
<head>
<meta charset="utf-8">
<style>
  :root{ --accent:#2c8a63; --accent2:#c05a2c; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    width:260px; height:320px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg{ overflow:visible; shape-rendering:geometricPrecision; }
  .line-main{ fill:none; stroke:#333; stroke-width:2.5; stroke-linecap:round; }
  .line-accent{ fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; }
  .line-aux{ stroke:var(--accent2); stroke-width:2; stroke-dasharray:5 4; }
  .line-fold{ stroke:#8a8f89; stroke-width:1.8; stroke-dasharray:3 3; }
  .pt{ fill:#1f2420; stroke:#ffffff; stroke-width:2.5; }
  .pt-accent{ fill:var(--accent); stroke:#ffffff; stroke-width:2; }
  .label{
    font-size:16px; font-weight:600; fill:#1f2420;
    stroke:#ffffff; stroke-width:3.5px; paint-order:stroke fill;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
</style>
</head>
<body>
  <svg width="240" height="300" viewBox="0 0 240 300">
    <line class="line-main" x1="10" y1="210" x2="230" y2="210" />
    <line class="line-aux" x1="30" y1="150" x2="30" y2="210" />
    <line class="line-aux" x1="210" y1="30" x2="210" y2="210" />
    <line class="line-fold" x1="30" y1="270" x2="210" y2="30" />
    <line class="line-accent" x1="30" y1="150" x2="75" y2="210" />
    <line class="line-accent" x1="75" y1="210" x2="210" y2="30" />
    <circle class="pt" cx="30" cy="150" r="4" /><text class="label" x="4" y="146">A</text>
    <circle class="pt" cx="210" cy="30" r="4" /><text class="label" x="218" y="26">B</text>
    <circle class="pt" cx="30" cy="210" r="4" /><text class="label" x="6" y="226">C</text>
    <circle class="pt" cx="210" cy="210" r="4" /><text class="label" x="218" y="226">D</text>
    <circle class="pt-accent" cx="75" cy="210" r="4.5" /><text class="label" x="65" y="230">O</text>
    <circle class="pt" cx="30" cy="270" r="3.5" /><text class="label" x="4" y="288">A'</text>
  </svg>
</body>
</html>
