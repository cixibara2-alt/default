<!doctype html>
<html data-theme="__THEME__">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#ffffff;}
  body{
    width:700px; height:560px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg{ overflow:visible; shape-rendering:geometricPrecision; }
  .axis{ stroke:#333; stroke-width:2; }
  .side{ fill:none; stroke:#1f2420; stroke-width:2.5; }
  .bisector{ fill:none; stroke:#2c8a63; stroke-width:2.5; }
  .perp{ fill:none; stroke:#c05a2c; stroke-width:2.5; stroke-dasharray:6 4; }
  .rightangle{ fill:none; stroke:#555; stroke-width:1.5; }
  .pt{ fill:#1f2420; stroke:#ffffff; stroke-width:2.5; }
  .label{
    font-size:20px; font-weight:700; fill:#1f2420;
    stroke:#ffffff; stroke-width:4px; paint-order:stroke fill;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
</style>
</head>
<body>
  <svg width="660" height="520" viewBox="0 0 660 520">
    <!-- 坐标轴 -->
    <line class="axis" x1="20" y1="460" x2="630" y2="460" />
    <polygon points="630,460 618,455 618,465" fill="#333"/>
    <line class="axis" x1="60" y1="490" x2="60" y2="30" />
    <polygon points="60,30 55,42 65,42" fill="#333"/>
    <text class="label" x="636" y="468">x</text>
    <text class="label" x="40" y="26">y</text>

    <!-- 三角形边 OA, AB -->
    <line class="side" x1="60" y1="460" x2="60" y2="160" />
    <line class="side" x1="60" y1="160" x2="580" y2="460" />
    <!-- 角平分线 AC -->
    <line class="bisector" x1="60" y1="160" x2="233" y2="460" />
    <!-- EF 垂直于 AC -->
    <line class="perp" x1="30" y1="327" x2="220" y2="212" />

    <!-- 直角标记 at Q -->
    <path class="rightangle" d="M 125,273 L 133.7,268 L 138.7,276.7 L 130,281.7" />

    <!-- 点 -->
    <circle class="pt" cx="60" cy="460" r="5" /><text class="label" x="30" y="486">O</text>
    <circle class="pt" cx="60" cy="160" r="5" /><text class="label" x="34" y="148">A</text>
    <circle class="pt" cx="580" cy="460" r="5" /><text class="label" x="590" y="486">B</text>
    <circle class="pt" cx="233" cy="460" r="5" /><text class="label" x="225" y="490">C</text>
    <circle class="pt" cx="60" cy="310" r="5" /><text class="label" x="24" y="304">E</text>
    <circle class="pt" cx="125" cy="273" r="5" /><text class="label" x="132" y="258">Q</text>
    <circle class="pt" cx="190" cy="235" r="5" /><text class="label" x="200" y="222">F</text>
  </svg>
</body>
</html>
